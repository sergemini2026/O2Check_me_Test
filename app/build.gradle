plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.o2test'
    compileSdk 34

    defaultConfig {
        applicationId "com.local.o2test"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
  // Блок задания фиксированного имени APK
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "O2Test.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
